<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - MelodyMate</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 text-white flex items-center justify-center h-screen font-sans">

  <form method="POST" class="bg-gray-800/90 backdrop-blur p-8 rounded-2xl shadow-xl w-96 space-y-6 border border-gray-700">
    
    <!-- Logo / Brand -->
    <div class="text-center space-y-2">
      <h1 class="text-3xl font-extrabold bg-gradient-to-r from-indigo-400 to-purple-500 bg-clip-text text-transparent">
        MelodyMate
      </h1>
      <p class="text-gray-400 text-sm">Your Playlist Manager</p>
    </div>

    <!-- Form Title -->
    <h2 class="text-xl font-semibold text-center text-indigo-400">Login</h2>

    <!-- Email -->
    <div>
      <label for="email" class="block text-sm font-medium text-gray-300">Email</label>
      <input 
        type="email" 
        name="email" 
        id="email" 
        placeholder="you@example.com"
        required
        class="mt-1 w-full p-3 rounded-lg bg-gray-700 border border-gray-600 placeholder-gray-400 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
      >
    </div>

    <!-- Password -->
    <div>
      <label for="password" class="block text-sm font-medium text-gray-300">Password</label>
      <input 
        type="password" 
        name="password" 
        id="password" 
        placeholder="enter your password"
        required
        class="mt-1 w-full p-3 rounded-lg bg-gray-700 border border-gray-600 placeholder-gray-400 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
      >
    </div>

    <!-- Login Button -->
    <button 
      type="submit"
      class="w-full bg-indigo-600 hover:bg-indigo-500 px-4 py-3 rounded-lg font-semibold transition transform hover:scale-[1.02] shadow-lg"
    >
      Login
    </button>

    <!-- Divider -->
    <div class="flex items-center justify-center">
      <span class="h-px bg-gray-600 w-1/3"></span>
      <span class="px-3 text-gray-400 text-sm">or</span>
      <span class="h-px bg-gray-600 w-1/3"></span>
    </div>

    <!-- Register Link -->
    <p class="text-center text-sm text-gray-400">
      Don’t have an account? 
      <a href="/register" class="text-indigo-400 hover:text-indigo-300 font-medium">Register</a>
    </p>
  </form>

</body>
</html>
