<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - MelodyMate</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">

  <!-- Register Form -->
  <form method="POST" class="bg-gray-800 p-8 rounded-2xl shadow-xl w-96 space-y-5">
    <!-- Title -->
    <h1 class="text-3xl font-bold text-indigo-500 text-center">Create Account</h1>
    <p class="text-sm text-gray-400 text-center">Join MelodyMate and manage your playlists</p>

    <!-- Username -->
    <div>
      <label for="username" class="block text-sm font-medium mb-1">Username</label>
      <input 
        type="text" 
        id="username" 
        name="username" 
        placeholder="Enter your username"
        required
        class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
      >
    </div>

    <!-- Email -->
    <div>
      <label for="email" class="block text-sm font-medium mb-1">Email</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        placeholder="Enter your email"
        required
        class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
      >
    </div>

    <!-- Password -->
    <div>
      <label for="password" class="block text-sm font-medium mb-1">Password</label>
      <input 
        type="password" 
        id="password" 
        name="password" 
        placeholder="Enter your password"
        required
        class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
      >
    </div>

    <!-- Submit Button -->
    <button 
      type="submit" 
      class="w-full bg-indigo-600 py-3 rounded-lg font-medium hover:bg-indigo-500 transition duration-200"
    >
      Register
    </button>

    <!-- Link to Login -->
    <p class="text-center text-sm text-gray-400">
      Already have an account? 
      <a href="/login" class="text-indigo-400 hover:text-indigo-300">Login</a>
    </p>
  </form>

</body>
</html>
